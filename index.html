<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"><meta name="googlebot" content="noindex, nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' https://a.espncdn.com https://media-cdn.incrowdsports.com https://media-cdn.cortextech.io; connect-src https://site.api.espn.com https://api-live.euroleague.net https://live.euroleague.net https://feeds.incrowdsports.com; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Directos"><meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)"><link rel="apple-touch-icon" href="icon-180.png?v=2"><link rel="icon" type="image/png" sizes="32x32" href="icon-32.png?v=2"><link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=2"><style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Mis Directos</title>
<style>
/* Layout: lista plana; una fila por partido con escudos a ambos lados del marcador; grupos por competición; cabecera = navegación por días */
:root{
  --bg:#ffffff; --ink:#0f1115; --muted:#8a8f98; --soft:#f2f3f5; --line:#eceef1; --live:#e2312a;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b0b0c; --ink:#f2f3f5; --muted:#8b9099; --soft:#1a1b1e; --line:#1f2125; --live:#ff5a50; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0b0b0c; --ink:#f2f3f5; --muted:#8b9099; --soft:#1a1b1e; --line:#1f2125; --live:#ff5a50; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;appearance:none;-webkit-appearance:none;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:0 auto}

/* Cabecera: día anterior · día · día siguiente */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top .bar{display:grid;grid-template-columns:40px 40px 1fr 40px 40px;align-items:center;padding-block:10px 6px}
.ico{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.ico svg{width:22px;height:22px}
.ico[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
#fLive[aria-pressed="true"]{color:var(--live)}
.day small.lv{color:var(--live);font-weight:600}
.day small.dn{color:var(--ink);font-weight:600}
.arrow{width:40px;height:40px;display:grid;place-items:center;color:var(--ink);border-radius:50%}
.arrow svg{width:22px;height:22px}
.arrow:active{background:var(--soft)}
.day{text-align:center;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.day:disabled{cursor:default;color:var(--ink)}
.day small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:2px}
.gear{grid-column:5;width:36px;height:36px;display:grid;place-items:center;color:var(--muted);justify-self:end}
.gear svg{width:21px;height:21px}
.strip{font-size:12.5px;color:var(--muted);padding:2px 0 4px;text-align:center}
.strip button{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* Lista */
.lg{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 4px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 20px 74px 20px minmax(0,1fr);align-items:center;column-gap:6px;width:100%;padding:9px 0;text-align:left}
.row:active{opacity:.6}
.h,.a{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h{text-align:right}
.mid{display:flex;flex-direction:column;align-items:center;line-height:1.15;min-width:0}
.sc{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.st{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.live .sc,.live .st{color:var(--live)}
.live .st{font-weight:600}
.pre .sc{font-size:15px;font-weight:500;color:var(--muted)}
.sc.long{font-size:15.5px;letter-spacing:-.02em}
.post .h:not(.w),.post .a:not(.w){color:var(--muted)}
.post.draw .h,.post.draw .a{color:var(--ink)}
.crest{position:relative;width:20px;height:20px;border-radius:50%;background:var(--c,var(--soft));color:var(--t,var(--muted));display:grid;place-items:center;font-size:9.5px;font-weight:700;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)}
.crest img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.crest.ok{background:transparent;color:transparent;border-radius:0;box-shadow:none}

/* Detalle */
.ex{display:grid;grid-template-columns:minmax(0,1fr) 20px 74px 20px minmax(0,1fr);column-gap:6px;padding:0 0 10px;font-size:12.5px;color:var(--muted);line-height:1.5}
.ex .eh{grid-column:1;text-align:right}
.ex .ea{grid-column:5}
.ex .full{grid-column:1 / -1;text-align:center}
.ex .lab{grid-column:2 / 5;text-align:center;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;align-self:center}
.ex .full{margin-top:4px}
.rc{display:inline-block;width:6px;height:9px;border-radius:1px;background:var(--live);margin-right:4px}

.empty{padding:40px 0 8px;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--ink);font-weight:600;font-size:16px;margin-bottom:4px}
.empty button{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:2px;margin-top:6px}
.note{font-size:12.5px;color:var(--muted);margin:18px 0 0}
.foot{display:flex;justify-content:center;align-items:center;gap:16px;font-size:12px;color:var(--muted);padding:26px 0 22px}
.foot button{color:var(--muted);display:flex;align-items:center;gap:6px}
.foot svg{width:18px;height:18px}
.sk{height:40px;margin:2px 0;border-radius:8px;background:var(--soft)}

/* Selector de ligas */
.picker{position:fixed;inset:0;z-index:20;overscroll-behavior:contain;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.picker h1{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin:22px 0 22px;text-wrap:balance}
.sport{margin:0 0 20px}
.sport h2{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none;font-weight:600}
.pick-foot{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;font-size:16px}
.btn:disabled{opacity:.25;cursor:default}
</style>

<header class="top band">
  <div class="wrap bar">
    <button class="ico" id="fLive" type="button" data-filter="live" aria-pressed="false" aria-label="Solo en directo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".4"/></svg>
    </button>
    <button class="arrow" id="prevBtn" type="button" aria-label="Día anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="day" id="dayBtn" type="button"></button>
    <button class="arrow" id="nextBtn" type="button" aria-label="Día siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="ico" id="fDone" type="button" data-filter="done" aria-pressed="false" aria-label="Solo finalizados">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </button>
  </div>
</header>

<div class="band">
  <div class="wrap">
    <div class="strip" id="strip" hidden>Datos de ejemplo, sin conexión con el servidor. <button type="button" id="retryBtn">Reintentar</button></div>
    <main id="main"></main>
    <div class="foot">
      <button id="syncBtn" type="button"></button>
      <button id="gearBtn" type="button" aria-label="Elegir ligas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>Ligas</button>
    </div>
  </div>
</div>

<div class="picker" id="picker" role="dialog" aria-modal="true" aria-labelledby="pickTitle" hidden>
  <div class="band"><div class="wrap">
    <h1 id="pickTitle">¿Qué ligas quieres seguir?</h1>
    <div id="pickList"></div>
  </div></div>
  <div class="pick-foot band"><div class="wrap"><button class="btn" id="pickDone" type="button">Listo</button></div></div>
</div>

<script>
(function(){
"use strict";

const ESPN = "https://site.api.espn.com/apis/site/v2/sports";
const EL_GAMES = "https://api-live.euroleague.net/v2/competitions/E/seasons/";
const EL_LIVE = "https://live.euroleague.net/api/Header";
const EL_FEED = "https://feeds.incrowdsports.com/provider/euroleague-feeds/v2/competitions/E/seasons/";
const STORE_KEY = "misdirectos.ligas.v4";
const FILTER_KEY = "misdirectos.filtro";
const MY_LEAGUES = ["esp.1", "esp.2", "esp.copa_del_rey", "uefa.champions", "uefa.europa", "uefa.europa.conf", "uefa.nations", "eng.1", "ita.1", "ger.1", "fra.1", "por.1", "euroleague", "nba", "wnba", "nfl"];
const SPORTS = { soccer: "Fútbol", basketball: "Baloncesto", football: "Fútbol americano" };
const LEAGUES = [
  { id: "esp.1", sport: "soccer", name: "LaLiga" },
  { id: "esp.copa_del_rey", sport: "soccer", name: "Copa del Rey" },
  { id: "uefa.champions", sport: "soccer", name: "Champions League" },
  { id: "uefa.europa", sport: "soccer", name: "Europa League" },
  { id: "uefa.europa.conf", sport: "soccer", name: "Conference League" },
  { id: "uefa.nations", sport: "soccer", name: "Nations League" },
  { id: "eng.1", sport: "soccer", name: "Premier League" },
  { id: "ita.1", sport: "soccer", name: "Serie A" },
  { id: "ger.1", sport: "soccer", name: "Bundesliga" },
  { id: "fra.1", sport: "soccer", name: "Ligue 1" },
  { id: "por.1", sport: "soccer", name: "Liga Portugal" },
  { id: "ned.1", sport: "soccer", name: "Eredivisie" },
  { id: "usa.1", sport: "soccer", name: "MLS" },
  { id: "mex.1", sport: "soccer", name: "Liga MX" },
  { id: "arg.1", sport: "soccer", name: "Liga Argentina" },
  { id: "bra.1", sport: "soccer", name: "Brasileirão" },
  { id: "euroleague", sport: "basketball", name: "Euroliga", src: "el" },
  { id: "nfl", sport: "football", name: "NFL" },
  { id: "nba", sport: "basketball", name: "NBA" },
  { id: "wnba", sport: "basketball", name: "WNBA" },
  { id: "mens-college-basketball", sport: "basketball", name: "NCAA", halves: true },
  { id: "college-football", sport: "football", name: "NCAA Football" },
  { id: "esp.2", sport: "soccer", name: "LaLiga Hypermotion" }
];

const CACHE_KEY = "misdirectos.datos.v1";
const EL_KEY = "misdirectos.euroliga.v1";
const saved = loadSelection();
const S = { off: 0, filter: loadFilter(), selected: new Set(saved || MY_LEAGUES), cache: new Map(), open: new Set(), failed: new Set(),
  demo: false, offline: false, everOk: false, loading: false, loadingOff: 0, tried: null, pending: false, lastSync: null };

/* Guarda lo último descargado para abrir al instante */
let persistT = null;
function keepDays(){ return new Set([-1, 0, 1].map(o => ymd(dayAt(o)))); }
function persist(){
  if (S.demo) return;
  clearTimeout(persistT);
  persistT = setTimeout(() => {
    try {
      const keep = keepDays(), d = {};
      for (const [k, v] of S.cache) if (keep.has(k.split("|")[1])) d[k] = v;
      localStorage.setItem(CACHE_KEY, JSON.stringify({ at: (S.lastSync || new Date()).getTime(), d, pf: prefetched }));
    } catch (e) {}
  }, 500);
}
function hydrate(){
  try {
    const j = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (!j || !j.d) return;
    const keep = keepDays(); let n = 0;
    for (const k in j.d) if (keep.has(k.split("|")[1])) { S.cache.set(k, j.d[k]); n++; }
    if (n) { S.everOk = true; S.lastSync = new Date(j.at); }
    if (j.pf) for (const t in j.pf) if (keep.has(t)) prefetched[t] = j.pf[t];
  } catch (e) {}
}

/* Se queda solo con los datos que usa la app */
function slim(e){
  const c = (e.competitions && e.competitions[0]) || {};
  const pick = (o, ks) => { const r = {}; if (o) ks.forEach(k => { if (o[k] != null) r[k] = o[k]; }); return r; };
  const st = e.status || {};
  return {
    id: e.id, date: e.date,
    status: { period: st.period, displayClock: st.displayClock, type: pick(st.type, ["name", "state"]) },
    competitions: [{
      situation: c.situation ? Object.assign(pick(c.situation, ["downDistanceText", "possession", "isRedZone"]), c.situation.lastPlay ? { lastPlay: { text: c.situation.lastPlay.text } } : {}) : undefined,
      competitors: (c.competitors || []).map(x => Object.assign(pick(x, ["id", "homeAway", "score", "winner", "shootoutScore"]), {
        record: ((x.records || []).find(r => r.type === "total" || r.name === "overall") || (x.records || [])[0] || {}).summary,
        team: pick(x.team, ["id", "displayName", "shortDisplayName", "abbreviation", "logo", "color"]),
        linescores: (x.linescores || []).map(l => ({ value: l.displayValue != null ? l.displayValue : l.value }))
      })),
      details: (c.details || []).filter(d => d.scoringPlay || d.redCard || /Goal|Red Card/i.test((d.type && d.type.text) || "")).map(d => ({
        type: pick(d.type, ["text"]), clock: pick(d.clock, ["displayValue"]), team: pick(d.team, ["id"]),
        scoringPlay: d.scoringPlay, redCard: d.redCard, penaltyKick: d.penaltyKick, ownGoal: d.ownGoal, shootout: d.shootout,
        athletesInvolved: (d.athletesInvolved || []).slice(0, 1).map(p => pick(p, ["displayName", "shortName"]))
      }))
    }]
  };
}

/* ---------- utilidades ---------- */
function loadSelection(){
  try { const a = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); if (Array.isArray(a) && a.length) return a.filter(id => LEAGUES.some(l => l.id === id)); } catch (e) {}
  return null;
}
function loadFilter(){ try { const f = localStorage.getItem(FILTER_KEY); if (f === "live" || f === "done") return f; } catch (e) {} return "all"; }
function saveFilter(){ try { localStorage.setItem(FILTER_KEY, S.filter); } catch (e) {} }
function saveSelection(){ try { localStorage.setItem(STORE_KEY, JSON.stringify([...S.selected])); } catch (e) {} }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function pad(n){ return String(n).padStart(2, "0"); }
function ymd(d){ return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
function dayAt(off){ const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + off); return d; }
function sameDay(a, b){ return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function key(id, off){ return id + "|" + ymd(dayAt(off)); }
function keyTag(id, tag){ return id + "|" + tag; }
function selLeagues(){ return LEAGUES.filter(l => S.selected.has(l.id)); }
function stateOf(e){ return (e && e.status && e.status.type && e.status.type.state) || "pre"; }
function isOff(e){ return /POSTPONED|CANCEL|ABANDONED/.test((e && e.status && e.status.type && e.status.type.name) || ""); }
const fmtTime = new Intl.DateTimeFormat("es-ES", { hour: "2-digit", minute: "2-digit" });
const fmtDay = new Intl.DateTimeFormat("es-ES", { weekday: "long", day: "numeric", month: "long" });
const fmtShort = new Intl.DateTimeFormat("es-ES", { day: "numeric", month: "short" });
const byDate =(x, y) => new Date(x.date) - new Date(y.date);
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function textOn(hex){
  const h = String(hex || "").replace("#", ""); if (h.length !== 6) return "#ffffff";
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return 0.299 * r + 0.587 * g + 0.114 * b > 165 ? "#111111" : "#ffffff";
}

async function fetchJSON(url, ms){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms || 12000);
  try {
    const r = await fetch(url, { signal: ctrl.signal, cache: "no-store", headers: { Accept: "application/json" } });
    if (!r.ok) { const err = new Error("HTTP " + r.status); err.http = r.status; throw err; }
    return await r.json();
  } finally { clearTimeout(t); }
}

/* ---------- ESPN: fútbol, NBA, NFL… ---------- */
async function fetchEspn(lg, off){
  const day = dayAt(off);
  const base = ESPN + "/" + lg.sport + "/" + lg.id + "/scoreboard?limit=300&dates=";
  /* ESPN agrupa por fecha de EE. UU. (ya no acepta rangos): en ligas de América el día anterior trae los partidos de madrugada */
  const want = e => sameDay(new Date(e.date), day) || (off === 0 && stateOf(e) === "in");
  const [prev, cur] = await Promise.all([
    EUROPE.test(lg.id) ? [] : espnPrev(base, lg.id, ymd(dayAt(off - 1)), want),
    fetchJSON(base + ymd(day)).then(j => j.events || [])
  ]);
  const seen = new Set();
  return prev.concat(cur).filter(e => {
    if (seen.has(e.id)) return false; seen.add(e.id);
    return want(e);
  }).sort(byDate).map(slim);
}
const EUROPE = /^(esp|eng|ita|ger|fra|por|ned|uefa)\./;
/* El día anterior solo se vuelve a pedir si trae partidos de hoy sin acabar, o cada 10 min */
const PREV = new Map();
async function espnPrev(base, id, tag, want){
  const k = id + "|" + tag, c = PREV.get(k);
  if (c && Date.now() - c.at < 10 * 60000 && !c.evs.some(e => want(e) && stateOf(e) !== "post")) return c.evs;
  try { const evs = (await fetchJSON(base + tag)).events || []; PREV.set(k, { at: Date.now(), evs }); return evs; }
  catch (e) { return c ? c.evs : []; }
}

/* ---------- Euroliga: API oficial ---------- */
let elSeason = null, elInflight = null;
function elSeasonCode(d){ return "E" + (d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear() - 1); }
function elDate(g){
  const s = g.utcDate || g.date;
  if (!s) return null;
  return new Date(/Z$|[+-]\d\d:?\d\d$/.test(s) ? s : s + "Z");
}
function elTeam(side, played, win){
  const club = (side && side.club) || {};
  const imgs = club.images || {};
  const c = { id: club.code, team: { id: club.code, displayName: club.name, shortDisplayName: club.abbreviatedName || club.name, logo: imgs.crest || imgs.logo || club.crest } };
  if (played && side && side.score != null) { c.score = String(side.score); c.winner = win; }
  const p = (side && side.partials) || {};
  const lines = [p.partials1, p.partials2, p.partials3, p.partials4].concat(Object.values(p.extraPeriods || {})).filter(v => v != null);
  if (played && lines.some(v => Number(v) > 0)) c.linescores = lines.map(v => ({ value: v }));
  return c;
}
function elToEvent(g){
  const played = !!g.played;
  const hs = Number(g.local && g.local.score), as = Number(g.road && g.road.score);
  const h = elTeam(g.local, played, hs > as), a = elTeam(g.road, played, as > hs);
  h.homeAway = "home"; a.homeAway = "away";
  return { id: "el-" + g.gameCode, date: elDate(g).toISOString(),
    status: { type: played ? { name: "STATUS_FINAL", state: "post" } : { name: "STATUS_SCHEDULED", state: "pre" } },
    competitions: [{ competitors: [h, a] }] };
}
function applyHeader(ev, hd){
  if (!hd || typeof hd !== "object") return;
  const [h, a] = ev.competitions[0].competitors;
  const sa = String(hd.ScoreA == null ? "" : hd.ScoreA).trim(), sb = String(hd.ScoreB == null ? "" : hd.ScoreB).trim();
  const live = hd.Live === true || hd.Live === "true";
  const q = parseInt(String(hd.Quarter || "").replace(/\D/g, ""), 10) || 0;
  /* El Header da marcadores acumulados al final de cada cuarto (y de la prórroga): se pasan a parciales */
  const num = v => Number(v) || 0;
  const cA = [1, 2, 3, 4].map(i => num(hd["ScoreQuarter" + i + "A"])), cB = [1, 2, 3, 4].map(i => num(hd["ScoreQuarter" + i + "B"]));
  if (num(hd.ScoreExtraTimeA) + num(hd.ScoreExtraTimeB) > 0) { cA.push(num(hd.ScoreExtraTimeA)); cB.push(num(hd.ScoreExtraTimeB)); }
  let n = live && q ? Math.min(q, cA.length) : cA.length;
  while (n > 0 && cA[n - 1] + cB[n - 1] === 0) n--;
  for (let i = 1; i < n; i++) if (cA[i] < cA[i - 1] || cB[i] < cB[i - 1]) { n = i; break; }
  if (n) {
    h.linescores = cA.slice(0, n).map((v, i) => ({ value: v - (i ? cA[i - 1] : 0) }));
    a.linescores = cB.slice(0, n).map((v, i) => ({ value: v - (i ? cB[i - 1] : 0) }));
  }
  if (live) {
    if (sa !== "") { h.score = sa; a.score = sb; }
    ev.status = { period: q, displayClock: String(hd.RemainingPartialTime || "").replace(/^0(\d)/, "$1"), type: { name: "STATUS_IN_PROGRESS", state: "in" } };
  } else if (sa !== "" && Number(sa) + Number(sb) > 0 && Date.now() - new Date(ev.date).getTime() > 100 * 60000) {
    h.score = sa; a.score = sb; h.winner = Number(sa) > Number(sb); a.winner = Number(sb) > Number(sa);
    ev.status = { type: { name: "STATUS_FINAL", state: "post" } };
  }
}
/* Fuente de respaldo: el feed que usa la web oficial de la Euroliga */
function feedSide(x, live, played, win){
  x = x || {};
  const q = x.quarters || {};
  const lines = ["q1", "q2", "q3", "q4", "ot1", "ot2", "ot3"].map(k => q[k]).filter(v => v != null);
  const c = { id: x.code, team: { id: x.code, displayName: x.name, shortDisplayName: x.abbreviatedName || x.editorialName || x.name, logo: x.imageUrls && x.imageUrls.crest } };
  if ((live || played) && x.score != null) c.score = String(x.score);
  if (played) c.winner = win;
  if ((live || played) && lines.length) c.linescores = lines.map(v => ({ value: v }));
  return c;
}
function feedToEvent(g){
  const st = String(g.status || "").toLowerCase();
  const played = /result|final|finish|ended|played/.test(st);
  const live = !played && (/live|progress|playing|half|break/.test(st) || g.quarter != null);
  const hs = Number(g.home && g.home.score), as = Number(g.away && g.away.score);
  const h = feedSide(g.home, live, played, hs > as), a = feedSide(g.away, live, played, as > hs);
  h.homeAway = "home"; a.homeAway = "away";
  const q = parseInt(String(g.quarter == null ? "" : g.quarter).replace(/\D/g, ""), 10) || 0;
  const status = played ? { type: { name: "STATUS_FINAL", state: "post" } }
    : live ? { period: q, displayClock: String(g.remainingTime || "").replace(/^0(\d)/, "$1"), type: { name: /half|break/.test(st) ? "STATUS_HALFTIME" : "STATUS_IN_PROGRESS", state: "in" } }
    : { type: { name: "STATUS_SCHEDULED", state: "pre" } };
  return { id: "el-" + (g.code || g.identifier), date: new Date(g.date).toISOString(), status, competitions: [{ competitors: [h, a] }] };
}
/* Sin jornada, el feed devuelve el final de la temporada: se busca por fechas la jornada del día pedido */
const feedRounds = new Map();
function feedRound(code, n){
  const k = code + "|" + n, c = feedRounds.get(k);
  if (c && Date.now() - c.at < 60000) return c.p;
  const p = fetchJSON(EL_FEED + code + "/games?phaseTypeCode=RS&roundNumber=" + n, 20000).then(j => (j && j.data) || []);
  feedRounds.set(k, { at: Date.now(), p });
  p.catch(() => feedRounds.delete(k));
  return p;
}
const roundOf = g => (g.round && g.round.round) || g.round;
async function fetchEuroleagueFeed(off, code){
  const day = dayAt(off), end = dayAt(off + 1);
  const k = code + "|max";
  if (!feedRounds.has(k)) { const p = fetchJSON(EL_FEED + code + "/games", 20000); feedRounds.set(k, { at: Date.now(), p }); p.catch(() => feedRounds.delete(k)); }
  const first = (await feedRounds.get(k).p || {}).data || [];
  const nums = first.map(roundOf).filter(n => typeof n === "number");
  let lo = 1, hi = nums.length ? Math.max(...nums) : 40;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    const ds = (await feedRound(code, mid)).map(g => new Date(g.date).getTime()).filter(t => !isNaN(t));
    if (ds.length && Math.max(...ds) < day.getTime()) lo = mid + 1; else hi = mid;
  }
  const lists = await Promise.all([lo - 1, lo, lo + 1].filter(n => n > 0).map(n => feedRound(code, n).catch(() => [])));
  const seen = new Set();
  return [].concat(...lists).filter(g => {
    const id = g.code || g.identifier; if (seen.has(id)) return false; seen.add(id);
    const d = new Date(g.date); return !isNaN(d) && d >= day && d < end;
  }).map(feedToEvent).sort(byDate);
}

function elSlim(g){
  const side = x => {

    return { score: x.score, partials: x.partials, club: { code: c.code, name: c.name, abbreviatedName: c.abbreviatedName, images: { crest: c.images && c.images.crest } } };

}
function elLoad(){ try { const j = JSON.parse(localStorage.getItem(EL_KEY) || "null"); if (j && j.games) elSeason = j; } catch (e) {} }
async function fetchEuroleague(off){
  const day = dayAt(off);
  const code = elSeasonCode(day);
  const now = Date.now();
  if (!elSeason) elLoad();
  const stale = !elSeason || elSeason.code !== code || now - elSeason.at > 30 * 60000;
  if (stale) {
    try {
      /* Una sola descarga de la temporada aunque se pidan varios días a la vez */
      if (!elInflight || elInflight.code !== code) elInflight = { code, p: fetchJSON(EL_GAMES + code + "/games", 25000).then(j => {
        const games = (Array.isArray(j) ? j : (j.data || j.games || [])).map(elSlim);
        if (!games.length) throw new Error("vacío");
        elSeason = { code, at: Date.now(), games };
        try { localStorage.setItem(EL_KEY, JSON.stringify(elSeason)); } catch (e) {}
      }).finally(() => { elInflight = null; }) };
      await elInflight.p;
    } catch (e) {
      if (!elSeason || elSeason.code !== code) return fetchEuroleagueFeed(off, code);
    }
  }
  const games = elSeason.games.filter(g => { const d = elDate(g); return d && !isNaN(d) && sameDay(d, day); });
  const evs = await Promise.all(games.map(async g => {
    const ev = elToEvent(g);
    const start = new Date(ev.date).getTime();
    if (!g.played && start <= now + 5 * 60000 && now - start < 6 * 3600000) {
      try { applyHeader(ev, await fetchJSON(EL_LIVE + "?gamecode=" + encodeURIComponent(g.gameCode) + "&seasoncode=" + code)); } catch (e) {}
    }
    return ev;
  }));
  return evs.sort(byDate);
}

function fetchLeague(lg, off){ return lg.src === "el" ? fetchEuroleague(off) : fetchEspn(lg, off); }
let renderT = null;
function renderSoon(){ if (renderT) return; renderT = setTimeout(() => { renderT = null; render(); }, 80); }
const prefetched = {};
function prefetchNeighbors(){
  [-1, 1].forEach(o => {
    const tag = ymd(dayAt(o));
    if (prefetched[tag] && Date.now() - prefetched[tag] < 10 * 60000) return;
    prefetched[tag] = Date.now();
    /* Escalonada para no lanzar decenas de peticiones a la vez */
    selLeagues().forEach((lg, i) => setTimeout(() => {
      if (ymd(dayAt(o)) !== tag) return;
      fetchLeague(lg, o).then(evs => { S.cache.set(keyTag(lg.id, tag), evs); persist(); if (ymd(dayAt(S.off)) === tag) renderSoon(); }).catch(() => {});
    }, (o < 0 ? 0 : 1500) + i * 120));
  });
}
async function refresh(force){
  /* Si ya se está cargando el mismo día, no se encadena otra carga (salvo cambio de ligas) */
  if (S.loading) { if (force || S.off !== S.loadingOff) S.pending = true; return; }
  const leagues = selLeagues();
  if (!leagues.length) { render(); return; }
  const off = S.off, tag = ymd(dayAt(off));
  const same = () => ymd(dayAt(S.off)) === tag;
  S.loading = true; S.loadingOff = off; renderSync();
  const failed = new Set(); let ok = 0;
  await Promise.all(leagues.map(lg => fetchLeague(lg, off)
    .then(evs => {
      if (S.demo) { S.cache.clear(); S.demo = false; }
      ok++; S.everOk = true; S.offline = false;
      S.cache.set(keyTag(lg.id, tag), evs);
      if (same()) renderSoon();
    })
    .catch(() => failed.add(lg.id))));
  if (ok) {
    if (same()) S.failed = failed;
    S.lastSync = new Date(); persist();
    if (off === 0) prefetchNeighbors();
  } else if (!S.everOk) {
    enterDemo();
  } else {
    S.offline = true;
    if (same()) S.failed = failed;
  }
  if (same()) S.tried = tag;
  S.loading = false;
  render();
  if (S.pending) { S.pending = false; refresh(); }
}

function logoUrl(u){
  let x; try { x = new URL(String(u || "")); } catch (e) { return ""; }
  if (x.protocol !== "https:" || !LOGO_HOSTS.has(x.hostname)) return "";
  if (x.hostname === "a.espncdn.com" && /^\/i\/teamlogos\/[\w\/.-]+\.png$/i.test(x.pathname)) return "https://a.espncdn.com/combiner/i?img=" + x.pathname + "&w=60&h=60";

}

function nameOf(cp){ const t = cp.team || {}; return t.shortDisplayName || t.displayName || "Por determinar"; }
function crest(cp){
  const t = cp.team || {};

  const style = col ? ' style="--c:' + esc(col) + ";--t:" + textOn(col) + '"' : "";

function statusText(e, sport, periods){
  periods = periods || 4;
  const st = e.status || {}; const t = st.type || {}; const n = t.name || ""; const s = t.state || "pre";
  if (/POSTPONED/.test(n)) return "Aplazado";
  if (/CANCEL/.test(n)) return "Cancelado";
  if (/SUSPENDED|DELAYED|ABANDONED/.test(n)) return "Suspendido";
  if (s === "in") {
    if (/HALFTIME/.test(n)) return "Descanso";
    if (sport === "soccer") return st.displayClock || "En juego";
    const p = st.period ? (st.period <= periods ? st.period + (periods === 2 ? "T" : "C") : "Pró.") : "";
    if (/END_PERIOD/.test(n)) return "Fin " + p;
    const clock = st.displayClock && st.displayClock !== "0:00" ? st.displayClock : "";
    return [p, clock].filter(Boolean).join(" · ") || "En juego";
  }
  if (s === "post") {
    const { h, a } = teams(e);
    if (/PEN/.test(n)) return h.shootoutScore != null && a.shootoutScore != null ? "Pen. " + h.shootoutScore + "-" + a.shootoutScore : "Penaltis";
    if (/AET|EXTRA_TIME/.test(n) || (sport !== "soccer" && st.period > periods)) return "Prórroga";
    return "Final";
  }
  return "";
}

  }
  return out;
}
async function elLeaders(e){
  const code = String(e.id).replace(/^el-/, "");
  const j = await fetchJSON(EL_LIVE.replace("Header", "Boxscore") + "?gamecode=" + encodeURIComponent(code) + "&seasoncode=" + elSeasonCode(new Date(e.date)), 15000);
  const stats = j.Stats || j.stats || [];
  const { h, a } = teams(e);
  const out = {};
  stats.slice(0, 2).forEach((t, i) => {
    const ps = (t.PlayersStats || t.playersStats || []).filter(p => p.Player && !/^team$/i.test(p.Player));
    const best = k => ps.slice().sort((x, y) => (Number(y[k]) || 0) - (Number(x[k]) || 0))[0];
    const vals = {};
    [["Points", "points"], ["TotalRebounds", "rebounds"], ["Assistances", "assists"]].forEach(([k, cat]) => {
      const p = best(k); if (p && Number(p[k]) > 0) vals[cat] = niceName(p.Player) + " " + p[k];
    });
    out[String(((i === 0 ? h : a).team || {}).id || "")] = vals;
  });
  return out;
}
function extraFresh(e){
  const x = EXTRA.get(e.id);
  if (!x) return false;
  if (x.err) return Date.now() - x.at < 30000;
  if (stateOf(e) !== "post") return Date.now() - x.at < 90000;
  return x.post;
}
const INFLIGHT = new Set();
async function loadExtra(lg, e){
  if (lg.sport === "soccer" || stateOf(e) === "pre" || S.demo || extraFresh(e) || INFLIGHT.has(e.id)) return false;
  INFLIGHT.add(e.id);
  const post = stateOf(e) === "post";
  try { EXTRA.set(e.id, { at: Date.now(), post, data: lg.src === "el" ? await elLeaders(e) : await espnLeaders(lg, e) }); }
  catch (err) { const old = EXTRA.get(e.id); EXTRA.set(e.id, { at: Date.now(), err: true, data: old && old.data }); }
  finally { INFLIGHT.delete(e.id); }
  return true;
}
function updateOpenDetail(lg, e){
  const row = [...document.querySelectorAll(".row")].find(r => r.dataset.id === String(e.id));
  if (!row || !S.open.has(e.id)) return;
  const ex = row.nextElementSibling; const html = detailHTML(lg, e);
  if (html) ex.innerHTML = html;
}

function detailHTML(lg, e){
  const { c, h, a } = teams(e);
  const s = stateOf(e);
  let hs = "", as = "", full = "";
  if (lg.sport === "soccer") {
    const hid = String((h.team && h.team.id) || h.id || "");
    for (const d of c.details || []) {
      const txt = (d.type && d.type.text) || "";
      const red = d.redCard || /Red Card/i.test(txt);
      const goal = !red && (d.scoringPlay || /Goal/i.test(txt)) && !d.shootout;
      if (!red && !goal) continue;
      const p = d.athletesInvolved && d.athletesInvolved[0];
      const who = (p && (p.shortName || p.displayName)) || "";
      const extra = d.ownGoal || /Own Goal/i.test(txt) ? " (p.p.)" : (d.penaltyKick || /Penalty/i.test(txt)) ? " (pen.)" : "";
      const line = "<div>" + (red ? '<span class="rc"></span>' : "") + esc(who + extra + " " + ((d.clock && d.clock.displayValue) || "")) + "</div>";
      if (String((d.team && d.team.id) || "") === hid) hs += line; else as += line;
    }
  } else {
    const v = x => x == null ? "" : (x.displayValue != null ? x.displayValue : x.value);
    const tid = cp => String((cp.team && cp.team.id) || cp.id || "");
    const x = EXTRA.get(e.id), X = (x && x.data) || {};
    const rows = [];
    if (h.record || a.record) rows.push(["Balance", h.record || "", a.record || ""]);
    if ((h.linescores || []).length) rows.push(["Cuartos", (h.linescores || []).map(v).join("  "), (a.linescores || []).map(v).join("  ")]);
    for (const [cat, label] of CATS[lg.sport] || []) {
      const hv = (X[tid(h)] || {})[cat], av = (X[tid(a)] || {})[cat];
      if (hv || av) rows.push([label, hv || "", av || ""]);
    }
    const statRows = rows.map(([lab, hv, av]) => '<div class="eh">' + esc(hv) + '</div><div class="lab">' + esc(lab) + '</div><div class="ea">' + esc(av) + "</div>").join("");
    const sit = c.situation;
    if (s === "in" && sit && (sit.downDistanceText || (sit.lastPlay && sit.lastPlay.text))) {
      const pos = [h, a].find(cp => String((cp.team && cp.team.id) || cp.id) === String(sit.possession || ""));
      full += "<div>" + esc([pos && pos.team ? "Balón: " + (pos.team.abbreviation || nameOf(pos)) : "", sit.downDistanceText].filter(Boolean).join(" · ")) + "</div>";
      if (sit.lastPlay && sit.lastPlay.text) full += "<div>" + esc(sit.lastPlay.text) + "</div>";
    }
    if (s !== "pre" && !S.demo && !EXTRA.has(e.id)) full += "<div>Cargando estadísticas…</div>";
    return statRows + (full ? '<div class="full">' + full + "</div>" : "");
  }
  return (hs ? '<div class="eh">' + hs + "</div>" : "") + (as ? '<div class="ea">' + as + "</div>" : "") +
    (full ? '<div class="full">' + full + "</div>" : "");
}

/* ---------- vista ---------- */
function dayItems(off){
  const out = [];
  for (const lg of selLeagues()) { const evs = S.cache.get(key(lg.id, off)); if (evs) for (const e of evs) out.push({ lg, e }); }
  return out;
}
function groupsHTML(items){
  const m = new Map();
  for (const { lg, e } of items) { if (!m.has(lg.id)) m.set(lg.id, []); m.get(lg.id).push(e); }
  return LEAGUES.filter(l => m.has(l.id)).map(l => '<section><h2 class="lg">' + esc(l.name) + "</h2>" + m.get(l.id).map(e => rowHTML(l, e)).join("") + "</section>").join("");
}
function renderDay(){
  const d = dayAt(S.off);
  const rel = S.off === 0 ? "Hoy" : S.off === -1 ? "Ayer" : S.off === 1 ? "Mañana" : "";
  const full = cap(fmtDay.format(d));
  const btn = document.getElementById("dayBtn");
  const tag = S.off === 0 && S.filter === "live" ? '<small class="lv">En directo</small>' : S.off === 0 && S.filter === "done" ? '<small class="dn">Finalizados</small>' : "";
  btn.innerHTML = tag ? esc(rel) + tag : rel ? esc(rel) + "<small>" + esc(full) + "</small>" : esc(full.split(",")[0]) + "<small>" + esc(full.split(",").slice(1).join(",").trim()) + "</small>";
  btn.setAttribute("aria-label", (rel ? rel + ", " : "") + full + (S.off !== 0 ? ". Toca para volver a hoy" : ""));
  btn.disabled = S.off === 0;
}
function render(){
  renderDay();
  document.getElementById("strip").hidden = !S.demo;
  const main = document.getElementById("main");
  if (!S.selected.size) { main.innerHTML = '<div class="empty"><b>Sin ligas</b><button type="button" data-pick>Elegir ligas</button></div>'; renderSync(); return; }
  const all = dayItems(S.off);
  ["fLive", "fDone"].forEach(id => {
    const b = document.getElementById(id);
    b.style.visibility = S.off === 0 ? "" : "hidden";
    b.setAttribute("aria-pressed", String(S.off === 0 && S.filter === b.dataset.filter));
  });
  const want = S.off === 0 ? S.filter : "all";
  const items = want === "live" ? all.filter(x => stateOf(x.e) === "in") : want === "done" ? all.filter(x => stateOf(x.e) === "post" && !isOff(x.e)) : all;
  const missing = selLeagues().filter(lg => !S.cache.has(key(lg.id, S.off))).length;
  /* Esqueleto mientras se carga; si ya se intentó y no llegó ninguna liga, es que no hubo conexión */
  const tried = !S.loading && S.tried === ymd(dayAt(S.off));
  if (!S.demo && !all.length && missing && !tried) {
    main.innerHTML = '<div class="sk" style="margin-top:22px"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>';
    renderSync(); return;
  }
  let html;
  const none = !S.demo && !all.length && missing === selLeagues().length;
  if (none) html = '<div class="empty"><b>Sin conexión</b>No se han podido cargar los partidos de este día.</div>';
  else if (items.length) html = groupsHTML(items);
  else if (want === "live") html = '<div class="empty"><b>Nada en directo ahora</b>Ninguna de tus ligas está jugando en este momento.</div>';
  else if (want === "done") html = '<div class="empty"><b>Aún no ha terminado ninguno</b>Los partidos acabados de hoy aparecerán aquí.</div>';
  else html = '<div class="empty"><b>Sin partidos</b>Tus ligas no juegan este día.</div>';
  if (!S.demo && !none && S.failed.size) {
    const names = selLeagues().filter(l => S.failed.has(l.id)).map(l => l.name);
    if (names.length) html += '<p class="note">No se pudo cargar: ' + esc(names.join(", ")) + "</p>";
  }
  main.innerHTML = html;
  renderSync();
  for (const { lg, e } of items) if (S.open.has(e.id) && lg.sport !== "soccer")
    loadExtra(lg, e).then(changed => { if (changed) updateOpenDetail(lg, e); });
}
function renderSync(){
  const el = document.getElementById("syncBtn");
  el.hidden = !S.loading && (S.demo || !S.lastSync);
  if (S.loading) { el.textContent = "Actualizando…"; return; }
  if (el.hidden) { el.textContent = ""; return; }
  const t = S.lastSync, when = sameDay(t, dayAt(0)) ? "" : sameDay(t, dayAt(-1)) ? "ayer " : fmtShort.format(t) + " ";
  el.textContent = (S.offline ? "Sin conexión · " : "") + "Actualizado " + when + fmtTime.format(t);
}
function goDay(delta){
  S.off = delta === 0 ? 0 : S.off + delta;
  S.failed = new Set();
  window.scrollTo(0, 0);
  render();
  refresh();
}

/* ---------- selector de ligas ---------- */
let draft = null;
function openPicker(){
  draft = new Set(S.selected);
  document.getElementById("pickList").innerHTML = Object.keys(SPORTS).map(sp =>
    '<div class="sport"><h2>' + esc(SPORTS[sp]) + '</h2><div class="chips">' +
    LEAGUES.filter(l => l.sport === sp).map(l => '<button class="chip" type="button" data-league="' + esc(l.id) + '" aria-pressed="' + draft.has(l.id) + '">' + esc(l.name) + "</button>").join("") +
    "</div></div>").join("");
  updateDone();
  document.getElementById("picker").hidden = false;
  document.body.style.overflow = "hidden";
  const first = document.querySelector("#pickList .chip"); if (first) first.focus({ preventScroll: true });
}
function updateDone(){
  const done = document.getElementById("pickDone");
  done.disabled = draft.size === 0; done.textContent = draft.size ? "Listo" : "Elige al menos una";
}
document.getElementById("pickList").addEventListener("click", ev => {
  const c = ev.target.closest(".chip"); if (!c) return;
  const id = c.dataset.league;
  if (draft.has(id)) draft.delete(id); else draft.add(id);
  c.setAttribute("aria-pressed", String(draft.has(id)));
  updateDone();
});
document.getElementById("pickDone").addEventListener("click", () => {
  if (!draft.size) return;
  S.selected = draft; saveSelection();
  document.getElementById("picker").hidden = true;
  document.body.style.overflow = "";
  document.getElementById("gearBtn").focus({ preventScroll: true });
  render(); refresh(true);
});

/* ---------- eventos ---------- */
document.getElementById("prevBtn").addEventListener("click", () => goDay(-1));
document.getElementById("nextBtn").addEventListener("click", () => goDay(1));
document.getElementById("dayBtn").addEventListener("click", () => { if (S.off !== 0) goDay(0); });
document.getElementById("gearBtn").addEventListener("click", openPicker);
["fLive", "fDone"].forEach(id => document.getElementById(id).addEventListener("click", ev => {
  const f = ev.currentTarget.dataset.filter;
  S.filter = S.filter === f ? "all" : f; saveFilter(); window.scrollTo(0, 0); render();
}));
document.getElementById("main").addEventListener("click", ev => {
  if (ev.target.closest("[data-pick]")) { openPicker(); return; }
  const row = ev.target.closest(".row"); if (!row) return;
  const id = row.dataset.id, lg = LEAGUES.find(l => l.id === row.dataset.lg), ex = row.nextElementSibling;
  if (S.open.has(id)) { S.open.delete(id); ex.hidden = true; row.setAttribute("aria-expanded", "false"); return; }
  const e = (S.cache.get(key(lg.id, S.off)) || []).find(x => x.id === id);
  const html = e ? detailHTML(lg, e) : "";
  if (!html) return;
  S.open.add(id); ex.innerHTML = html; ex.hidden = false; row.setAttribute("aria-expanded", "true");
  loadExtra(lg, e).then(changed => { if (changed) updateOpenDetail(lg, e); });
});
let tx = null, ty = null;
document.addEventListener("touchstart", ev => { if (ev.touches.length === 1) { tx = ev.touches[0].clientX; ty = ev.touches[0].clientY; } else tx = ty = null; }, { passive: true });
/* Un pellizco (dos dedos) no cambia de día */
document.addEventListener("touchmove", ev => { if (ev.touches.length > 1) tx = ty = null; }, { passive: true });
document.addEventListener("touchend", ev => {
  if (tx == null || !document.getElementById("picker").hidden) { tx = ty = null; return; }
  const dx = ev.changedTouches[0].clientX - tx, dy = ev.changedTouches[0].clientY - ty;
  tx = ty = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) goDay(dx < 0 ? 1 : -1);
}, { passive: true });
document.getElementById("syncBtn").addEventListener("click", () => refresh());
document.getElementById("retryBtn").addEventListener("click", () => { S.everOk = false; refresh(true); });
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && (S.demo || (S.lastSync && Date.now() - S.lastSync.getTime() > 15000))) refresh();
});
setInterval(() => { if (!document.hidden && S.off === 0 && document.getElementById("picker").hidden) refresh(); }, 30000);

hydrate();
render();
refresh();
})();
</script>

</html>
